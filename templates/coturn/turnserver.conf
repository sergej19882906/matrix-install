# coturn — TURN/STUN-сервер для WebRTC-звонков в Matrix
# Сгенерировано установщиком Matrix

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Публичный адрес сервера. За NAT 1:1 укажите external-ip=<публичный>/<приватный>
external-ip=${PUBLIC_IP}

realm=${TURN_DOMAIN}
server-name=${TURN_DOMAIN}

# Аутентификация по общему секрету (Synapse выдаёт временные учётки через /turn)
use-auth-secret
static-auth-secret=${TURN_SECRET}

# TLS-сертификат Let's Encrypt
cert=/etc/letsencrypt/live/${LETSENCRYPT_CERT}/fullchain.pem
pkey=/etc/letsencrypt/live/${LETSENCRYPT_CERT}/privkey.pem

min-port=49152
max-port=65535

no-cli
no-multicast-peers
no-loopback-peers
no-tlsv1
no-tlsv1_1
no-sslv3
cipher-list="HIGH:!SSLv2:!SSLv3:!aNULL:!MD5"
fingerprint

log-file=stdout
simple-log
verbose
