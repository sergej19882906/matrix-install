name: ${COMPOSE_PROJECT_NAME:-matrix}

x-common: &common
  restart: unless-stopped
  networks: [matrix]
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: postgres:16-alpine
    container_name: matrix-postgres
    environment:
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    shm_size: 512mb

  synapse:
    <<: *common
    image: matrixdotorg/synapse:${SYNAPSE_VERSION:-latest}
    container_name: matrix-synapse
    user: "8008:8008"
    environment:
      TZ: UTC
      SYNAPSE_SERVER_NAME: ${SERVER_NAME}
    volumes:
      - ./synapse:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8008/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  element-web:
    <<: *common
    image: vectorim/element-web:${ELEMENT_VERSION:-latest}
    container_name: matrix-element
    environment:
      TZ: UTC
    volumes:
      - ./element/config.json:/usr/share/nginx/html/config.json:ro

  synapse-admin:
    <<: *common
    image: etkecc/synapse-admin:${SYNAPSE_ADMIN_VERSION:-latest}
    container_name: matrix-synapse-admin
    environment:
      TZ: UTC
    volumes:
      - ./synapse-admin/config.json:/home/sws/public/config.json:ro

  nginx:
    <<: *common
    image: nginx:alpine
    container_name: matrix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./well-known:/var/www/matrix:ro
    depends_on:
      - synapse
      - element-web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  matrix:
    name: matrix
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET}

volumes:
  postgres-data:
    name: matrix-postgres-data
