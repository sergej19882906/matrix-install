### Bootstrap-конфигурация: только HTTP + ACME-challenge.
### Используется до получения сертификатов Let's Encrypt.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 503 "Matrix is being configured. Please try again in a few minutes.\n";
    }
}
